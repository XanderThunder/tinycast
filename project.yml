name: Tinycast
options:
  bundleIdPrefix: com.xanderthunder.tinycast
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # A stable self-signed identity keeps the Accessibility grant across rebuilds. docs/signing.md
    CODE_SIGN_IDENTITY: "Tinycast Self-Signed"
    SWIFT_STRICT_CONCURRENCY: complete
    TINYCAST_BUNDLE_IDENTIFIER: com.xanderthunder.tinycast
    TINYCAST_ENTITLEMENTS: Tinycast/Tinycast.entitlements
  configs:
    Debug:
      TINYCAST_BUNDLE_IDENTIFIER: com.xanderthunder.tinycast.dev
    Release:
      # Release-only: library validation refuses Debug's `.debug.dylib`, whose team never matches.
      ENABLE_HARDENED_RUNTIME: YES
      # Strip the shipped binary (dSYM is still generated first) and drop unused code.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

targets:
  Tinycast:
    type: application
    platform: macOS
    sources:
      - path: Tinycast
        # Helper-only sources, built into FileIndexHelper instead.
        excludes:
          - Features/FileSearch/Helper
      # The MIT mark's licence asks the notice to travel with the binary, not just the repo.
      - path: NOTICE.md
        buildPhase: resources
    configFiles:
      Debug: Config/Tinycast.xcconfig
    dependencies:
      # The crawl runs out of process, so its memory is returned when the helper exits.
      - target: FileIndexHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TINYCAST_BUNDLE_IDENTIFIER)"
        INFOPLIST_FILE: Tinycast/Info.plist
        CODE_SIGN_ENTITLEMENTS: "$(TINYCAST_ENTITLEMENTS)"
        ASSETCATALOG_COMPILER_APPICON_NAME: tinycast
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        # Debug is its own channel, so a local build never corrupts the installed app's state.
        Debug:
          PRODUCT_NAME: Tinycast Dev

  FileIndexHelper:
    type: tool
    platform: macOS
    sources:
      - Tinycast/Features/FileSearch/Helper/FileIndexHelper.swift
      - Tinycast/Features/FileSearch/Model/FileSearchIgnoreList.swift
      - Tinycast/Features/FileSearch/Model/FileSearchPolicy.swift
      - Tinycast/Features/FileSearch/Model/FileSearchQuery.swift
      - Tinycast/Features/FileSearch/Model/FileSearchResult.swift
      - Tinycast/Features/FileSearch/Model/FileSearchScope.swift
      - Tinycast/Features/FileSearch/Service/FileIndexCrawler.swift
      - Tinycast/Features/FileSearch/Service/FileIndexSnapshot.swift
    configFiles:
      Debug: Config/Tinycast.xcconfig
    settings:
      base:
        # Pinned, so a PRODUCT_NAME override can never rename the binary FileIndexer looks for.
        EXECUTABLE_NAME: FileIndexHelper
        PRODUCT_MODULE_NAME: FileIndexHelper
        SKIP_INSTALL: YES
        SWIFT_OPTIMIZATION_LEVEL: -O
